services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: file_share_db
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3307:3306" # Connect to 3307 on your host to avoid conflict with local MySQL
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: django_app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  mysql_data: