<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semester CGPA Calculator</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th {
            text-align: left;
            padding: 10px;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        select, input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .add-btn { background-color: #10b981; color: white; }
        .calc-btn { background-color: var(--primary-color); color: white; }
        .remove-btn { background-color: #ef4444; color: white; width: auto; padding: 5px 10px; }

        .result-section {
            margin-top: 2rem;
            padding: 1rem;
            background-color: #eff6ff;
            border-radius: 8px;
            text-align: center;
        }

        #final-cgpa {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Semester CGPA Calculator</h2>
    
    <table id="course-table">
        <thead>
            <tr>
                <th>Grade</th>
                <th>Credits</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="course-list">
            </tbody>
    </table>

    <div class="btn-group">
        <button class="add-btn" onclick="addCourse()">+ Add Course</button>
        <button class="calc-btn" onclick="calculateCGPA()">Calculate CGPA</button>
    </div>

    <div class="result-section">
        <span>Your Semester CGPA</span>
        <span id="final-cgpa">0.00</span>
        <small id="total-credits">Total Credits: 0</small>
    </div>
</div>

<script>
    // Grading scale based on your image
    const gradingScale = {
        "A+": 4.00,
        "A": 3.75,
        "A-": 3.50,
        "B+": 3.25,
        "B": 3.00,
        "B-": 2.75,
        "C+": 2.50,
        "C": 2.25,
        "D": 2.00,
        "F": 0.00
    };

    function addCourse() {
        const tbody = document.getElementById('course-list');
        const row = document.createElement('tr');
        
        let options = Object.keys(gradingScale).map(g => `<option value="${gradingScale[g]}">${g} (${gradingScale[g].toFixed(2)})</option>`).join('');

        row.innerHTML = `
            <td>
                <select class="grade-input">
                    ${options}
                </select>
            </td>
            <td>
                <input type="number" class="credit-input" placeholder="e.g. 3" min="0" step="0.5">
            </td>
            <td>
                <button class="remove-btn" onclick="this.parentElement.parentElement.remove()">×</button>
            </td>
        `;
        tbody.appendChild(row);
    }

    function calculateCGPA() {
        const grades = document.querySelectorAll('.grade-input');
        const credits = document.querySelectorAll('.credit-input');
        
        let totalPoints = 0;
        let totalCredits = 0;

        for (let i = 0; i < grades.length; i++) {
            const gradePoint = parseFloat(grades[i].value);
            const creditValue = parseFloat(credits[i].value);

            if (!isNaN(creditValue) && creditValue > 0) {
                totalPoints += (gradePoint * creditValue);
                totalCredits += creditValue;
            }
        }

        const cgpa = totalCredits > 0 ? (totalPoints / totalCredits) : 0;

        document.getElementById('final-cgpa').innerText = cgpa.toFixed(2);
        document.getElementById('total-credits').innerText = `Total Credits: ${totalCredits}`;
    }

    // Add 3 initial rows on load
    window.onload = () => {
        for(let i=0; i<3; i++) addCourse();
    };
</script>

</body>
</html>
