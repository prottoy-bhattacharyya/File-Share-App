<!DOCTYPE html>
<html>
<head>
    <style>
        .wrapper { background-color: #f6f9fc; padding: 40px 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #ffffff; max-width: 400px; margin: 0 auto; border-radius: 8px; border: 1px solid #e1e4e8; overflow: hidden; }
        .header { background-color: #007bff; padding: 20px; text-align: center; color: #ffffff; }
        .content { padding: 30px; text-align: center; }
        .otp-box { background-color: #f1f4f8; padding: 15px; border-radius: 6px; font-size: 32px; font-weight: bold; letter-spacing: 5px; color: #333; margin: 20px 0; border: 1px dashed #007bff; }
        .footer { padding: 20px; text-align: center; font-size: 12px; color: #6a737d; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="header">
                <h2>File Share App</h2>
            </div>
            <div class="content">
                <p>Hello,</p>
                <p>Use the verification code below to complete your login. This code is valid for <strong>5 minutes</strong>.</p>
                <div class="otp-box">{{ otp }}</div>
                <p>If you didn't request this, please ignore this email.</p>
            </div>
            <div class="footer">
                &copy; 2026 File Share App. All rights reserved.
            </div>
        </div>
    </div>
</body>
</html>
